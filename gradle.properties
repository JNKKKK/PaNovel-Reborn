# Project-wide Gradle settings.
android.enableJetifier=true
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m
# AGP 9 enables "built-in Kotlin" and the "new DSL" by default. These opt-outs
# (supported through AGP 9.x) keep the kotlin-android plugin, kotlin-kapt, and
# the existing DSL working, so the toolchain jump stays behavior-preserving.
# Adopting built-in Kotlin / KSP-only can be done later as an isolated change.
android.builtInKotlin=false
android.newDsl=false
