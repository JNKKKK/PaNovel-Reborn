dependencies {
    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    api 'com.squareup.okhttp3:okhttp:5.4.0'
    api 'org.jsoup:jsoup:' + jsoup_version
    // jsoup 1.18+ annotates its API with JSpecify @Nullable but ships it compileOnly.
    // Kotlin 2.x reads those annotations during type inference, so the artifact must
    // be on the compile classpath of anything parsing jsoup return types.
    api 'org.jspecify:jspecify:1.0.0'
}
